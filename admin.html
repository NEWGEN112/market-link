<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market Link — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f1419; --card: #1a2332; --line: #2a3544; --text: #e8eef5;
      --muted: #8b9bb0; --accent: #3dd68c; --input: #121a24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(900px 500px at 50% -10%, #1a3a2a 0%, var(--bg) 55%);
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 20px 12px 48px; }
    .pill { color: var(--accent); font-size: 12px; letter-spacing: 0.12em; font-weight: 700; margin: 0 0 6px; text-align: center; }
    h1 { margin: 0 0 6px; font-size: 24px; text-align: center; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; text-align: center; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; margin-bottom: 12px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
    input {
      width: 100%; background: var(--input); border: 1px solid var(--line); border-radius: 10px;
      padding: 11px 12px; color: var(--text); font-size: 15px; outline: none;
    }
    button {
      border: 0; border-radius: 10px; padding: 11px 14px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .primary { background: var(--accent); color: #0a1a12; width: 100%; margin-top: 10px; }
    .ghost { background: transparent; color: var(--muted); }
    .danger { background: #3a1515; color: #ffb4b4; border: 1px solid #5c2424; margin-top: 8px; width: 100%; }
    .error, .ok {
      display: none; margin-top: 10px; border-radius: 10px; padding: 10px; font-size: 14px;
    }
    .error { background: #3a1515; color: #ffb4b4; border: 1px solid #5c2424; }
    .ok { background: #14301a; color: #b7f5c2; border: 1px solid #2a5a36; }
    .error.show, .ok.show { display: block; }
    .hidden { display: none !important; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .item {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px;
      margin-bottom: 8px; background: var(--input);
    }
    .item b { color: var(--accent); }
    .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700; margin-left: 6px;
    }
    .on { background: #1a3a2a; color: var(--accent); }
    .off { background: #3a1515; color: #ffb4b4; }
    .code-big {
      font-size: 18px; font-weight: 800; letter-spacing: 0.06em;
      color: var(--accent); word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="gateView">
      <p class="pill">MARKET LINK ADMIN</p>
      <h1>Admin Access</h1>
      <p class="sub">Only you — create registration codes after payment</p>
      <div class="card">
        <label>Admin password</label>
        <input id="adminPass" type="password" placeholder="Admin password" />
        <button class="primary" id="gateBtn" type="button">Enter</button>
        <div class="error" id="gateError"></div>
      </div>
    </div>

    <div id="appView" class="hidden">
      <div class="top">
        <div>
          <p class="pill" style="text-align:left">MARKET LINK ADMIN</p>
          <h1 style="text-align:left;font-size:22px">Seller codes</h1>
        </div>
        <button class="ghost" id="logoutBtn" type="button">Lock</button>
      </div>

      <div class="card">
        <div style="font-weight:700;margin-bottom:6px">Create registration code</div>
        <p class="meta">After customer pays, create a code for their business name and send them the code.</p>
        <label>Business name (for your records)</label>
        <input id="businessLabel" type="text" placeholder="e.g. Mama Ada Fashion" />
        <label>Code (optional — leave blank to auto-generate)</label>
        <input id="customCode" type="text" placeholder="e.g. ML-MAMA-ADA" />
        <button class="primary" id="createCodeBtn" type="button">Create code</button>
        <div class="ok" id="newCodeBox"></div>
      </div>

      <div class="card">
        <div style="font-weight:700;margin-bottom:8px">All codes</div>
        <div id="codesList" class="meta">Loading...</div>
      </div>

      <div class="card">
        <div style="font-weight:700;margin-bottom:8px">Registered sellers</div>
        <div id="sellersList" class="meta">Loading...</div>
      </div>

      <div class="error" id="msgError"></div>
      <div class="ok" id="msgOk"></div>
    </div>
  </div>
  <script>
    var SUPABASE_URL = "https://mjtpfusiurqvlaxkpenm.supabase.co";
    var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qdHBmdXNpdXJxdmxheGtwZW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4ODMyNDksImV4cCI6MjEwMzQ1OTI0OX0.Irdh4ERkCOMCy_kp8onh61N8sBD77YscCp1e5kvvXL8";
    var ADMIN_PASSWORD = "MyNewSecret123";
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var gateView = document.getElementById("gateView");
    var appView = document.getElementById("appView");
    var gateError = document.getElementById("gateError");
    var msgError = document.getElementById("msgError");
    var msgOk = document.getElementById("msgOk");
    var newCodeBox = document.getElementById("newCodeBox");

    function show(el, msg) {
      el.textContent = msg || "";
      if (msg) el.classList.add("show"); else el.classList.remove("show");
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function adminOk() {
      return sessionStorage.getItem("ml_admin_ok") === "1";
    }
    function unlock() {
      sessionStorage.setItem("ml_admin_ok", "1");
      gateView.classList.add("hidden");
      appView.classList.remove("hidden");
      loadAll();
    }
    function lock() {
      sessionStorage.removeItem("ml_admin_ok");
      appView.classList.add("hidden");
      gateView.classList.remove("hidden");
    }
    function makeCode() {
      var part = Math.random().toString(36).slice(2, 8).toUpperCase();
      return "ML-" + part;
    }
    function cleanCode(s) {
      return String(s || "").trim().toUpperCase().replace(/\s+/g, "-");
    }

    function renderCodes(rows) {
      if (!rows.length) {
        document.getElementById("codesList").innerHTML =
          '<div class="meta">No codes yet. Create one after a seller pays.</div>';
        return;
      }
      var html = "";
      for (var i = 0; i < rows.length; i++) {
        var c = rows[i];
        var badge = c.is_used
          ? '<span class="badge off">USED</span>'
          : '<span class="badge on">AVAILABLE</span>';
        html += '<div class="item" data-id="' + c.id + '" data-used="' + (c.is_used ? "1" : "0") + '">';
        html += '<div class="code-big">' + esc(c.code) + badge + "</div>";
        html += '<div class="meta">Business: ' + esc(c.business_label) + "</div>";
        html += '<div class="meta">Created: ' + esc(String(c.created_at || "").slice(0, 19).replace("T", " ")) + "</div>";
        if (c.is_used) {
          html += '<div class="meta">Used at: ' + esc(String(c.used_at || "").slice(0, 19).replace("T", " ")) + "</div>";
        } else {
          html += '<button class="danger del-code" type="button">Delete unused code</button>';
        }
        html += "</div>";
      }
      document.getElementById("codesList").innerHTML = html;

      var items = document.querySelectorAll("#codesList .item");
      for (var j = 0; j < items.length; j++) {
        (function(item) {
          var btn = item.querySelector(".del-code");
          if (!btn) return;
          var id = item.getAttribute("data-id");
          btn.onclick = function() {
            if (!confirm("Delete this unused code?")) return;
            show(msgError, ""); show(msgOk, "");
            sb.from("access_codes").delete().eq("id", id).eq("is_used", false)
              .then(function(res) {
                if (res.error) return show(msgError, res.error.message);
                show(msgOk, "Code deleted.");
                return loadAll();
              });
          };
        })(items[j]);
      }
    }

    function renderSellers(rows) {
      if (!rows.length) {
        document.getElementById("sellersList").innerHTML =
          '<div class="meta">No sellers registered yet.</div>';
        return;
      }
      var html = "";
      for (var i = 0; i < rows.length; i++) {
        var s = rows[i];
        var shop = window.location.origin + "/shop.html?s=" + encodeURIComponent(s.shop_slug || "");
        html += '<div class="item">';
        html += "<b>" + esc(s.business_name) + "</b>";
        html += '<div class="meta">Slug: ' + esc(s.shop_slug) + "</div>";
        html += '<div class="meta">WhatsApp: ' + esc(s.whatsapp) + "</div>";
        html += '<div class="meta"><a style="color:#3dd68c" href="' + esc(shop) + '" target="_blank">' + esc(shop) + "</a></div>";
        html += "</div>";
      }
      document.getElementById("sellersList").innerHTML = html;
    }

    function loadAll() {
      show(msgError, "");
      return Promise.all([
        sb.from("access_codes").select("*").order("created_at", { ascending: false }),
        sb.from("seller_profiles").select("*").order("created_at", { ascending: false })
      ]).then(function(results) {
        if (results[0].error) throw results[0].error;
        if (results[1].error) throw results[1].error;
        renderCodes(results[0].data || []);
        renderSellers(results[1].data || []);
      }).catch(function(err) {
        show(msgError, err.message || String(err));
      });
    }

    document.getElementById("gateBtn").onclick = function() {
      var pass = document.getElementById("adminPass").value || "";
      if (pass !== ADMIN_PASSWORD) {
        show(gateError, "Wrong admin password.");
        return;
      }
      show(gateError, "");
      unlock();
    };

    document.getElementById("logoutBtn").onclick = function() {
      lock();
    };

    document.getElementById("createCodeBtn").onclick = function() {
      show(msgError, "");
      show(msgOk, "");
      show(newCodeBox, "");

      var label = document.getElementById("businessLabel").value.trim();
      var custom = cleanCode(document.getElementById("customCode").value);
      if (!label) return show(msgError, "Enter business name for this code.");

      var code = custom || makeCode();

      sb.from("access_codes").insert({
        code: code,
        business_label: label,
        is_used: false
      }).select("*").single().then(function(res) {
        if (res.error) throw res.error;
        var c = res.data;
        newCodeBox.classList.add("show");
        newCodeBox.innerHTML =
          "Code created for <b>" + esc(label) + "</b><br>" +
          '<div class="code-big" style="margin-top:8px">' + esc(c.code) + "</div>" +
          '<div class="meta" style="margin-top:8px">Send this code to the seller after payment.</div>';
        document.getElementById("businessLabel").value = "";
        document.getElementById("customCode").value = "";
        show(msgOk, "Code ready.");
        return loadAll();
      }).catch(function(err) {
        show(msgError, err.message || String(err));
      });
    };

    if (adminOk()) {
      unlock();
    }
  </script>
</body>
</html>
