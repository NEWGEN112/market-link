<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — Market Link</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --line: #2a3544;
      --text: #e8eef5;
      --muted: #8b9bb0;
      --accent: #3dd68c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(900px 500px at 50% -10%, #1a3a2a 0%, var(--bg) 55%);
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px 12px 48px; }
    .pill {
      text-align: center;
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.14em;
      font-weight: 700;
      margin: 0 0 6px;
    }
    h1 { text-align: center; margin: 0 0 6px; font-size: 26px; }
    .sub { text-align: center; color: var(--muted); margin: 0 0 18px; font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 560px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 820px) {
      .grid { grid-template-columns: 1fr 1fr 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #0a1018;
      display: block;
    }
    .body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .name { font-weight: 700; font-size: 16px; margin: 0 0 6px; }
    .price { color: var(--accent); font-weight: 800; font-size: 18px; margin: 0 0 12px; }
    .order {
      margin-top: auto;
      display: block;
      text-align: center;
      text-decoration: none;
      background: var(--accent);
      color: #0a1a12;
      font-weight: 800;
      padding: 12px;
      border-radius: 10px;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 12px;
      border: 1px dashed var(--line);
      border-radius: 14px;
    }
    .error {
      display: none;
      margin: 12px 0;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      background: #3a1515;
      color: #ffb4b4;
      border: 1px solid #5c2424;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="pill">MARKET LINK</p>
    <h1 id="shopTitle">Shop</h1>
    <p class="sub" id="shopSub">Loading products...</p>
    <div class="error" id="msgError"></div>
    <div class="grid" id="productGrid"></div>
  </div>
  <script>
    var SUPABASE_URL = "https://mjtpfusiurqvlaxkpenm.supabase.co";
    var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qdHBmdXNpdXJxdmxheGtwZW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4ODMyNDksImV4cCI6MjEwMzQ1OTI0OX0.Irdh4ERkCOMCy_kp8onh61N8sBD77YscCp1e5kvvXL8";
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var msgError = document.getElementById("msgError");

    function show(el, msg) {
      el.textContent = msg || "";
      if (msg) el.classList.add("show"); else el.classList.remove("show");
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function money(n) {
      return Number(n || 0).toLocaleString();
    }
    function getSlug() {
      var params = new URLSearchParams(window.location.search);
      return (params.get("s") || "").trim().toLowerCase();
    }
    function whatsappOrderLink(phone, productName, businessName) {
      var text = "Hi, I'm interested in *" + productName + "* from " + businessName + ". How can I get it?";
      return "https://wa.me/" + phone + "?text=" + encodeURIComponent(text);
    }

    function render(profile, products) {
      document.getElementById("shopTitle").textContent = profile.business_name || "Shop";
      document.getElementById("shopSub").textContent =
        products.length ? products.length + " item(s) available · Tap Order to WhatsApp" : "No products yet";

      var grid = document.getElementById("productGrid");
      if (!products.length) {
        grid.innerHTML = '<div class="empty">This shop has no products published yet.</div>';
        return;
      }

      var html = "";
      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        var img = p.image_url
          ? '<img src="' + esc(p.image_url) + '" alt="' + esc(p.name) + '" />'
          : '<div style="height:200px;background:#0a1018"></div>';
        var orderUrl = whatsappOrderLink(profile.whatsapp, p.name, profile.business_name);
        html += '<div class="card">';
        html += img;
        html += '<div class="body">';
        html += '<div class="name">' + esc(p.name) + "</div>";
        html += '<div class="price">₦' + money(p.price) + "</div>";
        html += '<a class="order" href="' + esc(orderUrl) + '" target="_blank" rel="noopener">Order on WhatsApp</a>';
        html += "</div></div>";
      }
      grid.innerHTML = html;
    }

    var slug = getSlug();
    if (!slug) {
      show(msgError, "No shop selected. Open a shop link like shop.html?s=mama-ada");
      document.getElementById("shopSub").textContent = "Missing shop link";
    } else {
      sb.from("seller_profiles").select("*").eq("shop_slug", slug).maybeSingle()
        .then(function(res) {
          if (res.error) throw res.error;
          if (!res.data) throw new Error("Shop not found. Check the link.");
          var profile = res.data;
          return sb.from("products")
            .select("*")
            .eq("seller_id", profile.id)
            .eq("is_published", true)
            .order("created_at", { ascending: false })
            .then(function(pRes) {
              if (pRes.error) throw pRes.error;
              render(profile, pRes.data || []);
            });
        })
        .catch(function(err) {
          show(msgError, err.message || String(err));
          document.getElementById("shopSub").textContent = "Could not load shop";
        });
    }
  </script>
</body>
</html>
