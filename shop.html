<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — Market Link</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f1419; --card: #1a2332; --line: #2a3544; --text: #e8eef5;
      --muted: #8b9bb0; --accent: #3dd68c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(900px 500px at 50% -10%, #1a3a2a 0%, var(--bg) 55%);
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px 12px 48px; }
    .pill {
      text-align: center; color: var(--accent); font-size: 12px;
      letter-spacing: 0.14em; font-weight: 700; margin: 0 0 6px;
    }
    h1 { text-align: center; margin: 0 0 6px; font-size: 26px; }
    .sub { text-align: center; color: var(--muted); margin: 0 0 14px; font-size: 14px; }
    .about {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; margin: 0 0 16px; color: var(--muted); font-size: 14px;
      line-height: 1.5; white-space: pre-wrap; display: none;
    }
    .about.show { display: block; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 820px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .gallery { position: relative; background: #0a1018; height: 220px; }
    .gallery img { width: 100%; height: 220px; object-fit: cover; display: block; }
    .nav {
      position: absolute; top: 50%; transform: translateY(-50%); border: 0;
      background: rgba(0,0,0,0.55); color: #fff; width: 34px; height: 34px;
      border-radius: 50%; font-size: 18px; font-weight: 700; cursor: pointer;
    }
    .nav.prev { left: 8px; }
    .nav.next { right: 8px; }
    .dots {
      position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
      font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000;
    }
    .body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .name { font-weight: 700; font-size: 16px; margin: 0 0 6px; }
    .price { color: var(--accent); font-weight: 800; font-size: 18px; margin: 0 0 8px; }
    .desc {
      color: var(--muted); font-size: 13px; line-height: 1.45;
      margin: 0 0 12px; white-space: pre-wrap;
    }
    .order {
      margin-top: auto; display: block; text-align: center; text-decoration: none;
      background: var(--accent); color: #0a1a12; font-weight: 800;
      padding: 12px; border-radius: 10px;
    }
    .empty {
      text-align: center; color: var(--muted); padding: 40px 12px;
      border: 1px dashed var(--line); border-radius: 14px;
    }
    .error {
      display: none; margin: 12px 0; border-radius: 10px; padding: 10px; font-size: 14px;
      background: #3a1515; color: #ffb4b4; border: 1px solid #5c2424;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="pill">MARKET LINK</p>
    <h1 id="shopTitle">Shop</h1>
    <p class="sub" id="shopSub">Loading products...</p>
    <div class="about" id="aboutBox"></div>
    <div class="error" id="msgError"></div>
    <div class="grid" id="productGrid"></div>
  </div>
  <script>
    var SUPABASE_URL = "https://mjtpfusiurqvlaxkpenm.supabase.co";
    var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qdHBmdXNpdXJxdmxheGtwZW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4ODMyNDksImV4cCI6MjEwMzQ1OTI0OX0.Irdh4ERkCOMCy_kp8onh61N8sBD77YscCp1e5kvvXL8";
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var msgError = document.getElementById("msgError");

    function show(el, msg) {
      el.textContent = msg || "";
      if (msg) el.classList.add("show"); else el.classList.remove("show");
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function money(n) {
      return Number(n || 0).toLocaleString();
    }
    function getSlug() {
      var params = new URLSearchParams(window.location.search);
      return (params.get("s") || "").trim().toLowerCase();
    }
    function cleanPhone(phone) {
      var n = String(phone || "").replace(/\D/g, "");
      if (n.length === 11 && n.charAt(0) === "0") n = "234" + n.slice(1);
      if (n.indexOf("2340") === 0 && n.length === 14) n = "234" + n.slice(4);
      return n;
    }
    function whatsappOrderLink(phone, productName, price, businessName, shopLink) {
      var n = cleanPhone(phone);
      var text =
        "Hi, I'm interested in *" + productName + "*\n" +
        "Price: ₦" + price + "\n" +
        "From: " + businessName + "\n" +
        "Shop: " + shopLink + "\n\n" +
        "How can I get it?";
      return "https://wa.me/" + n + "?text=" + encodeURIComponent(text);
    }

    function bindGallery(card, urls) {
      if (!urls || urls.length <= 1) return;
      var img = card.querySelector(".g-img");
      var dots = card.querySelector(".dots");
      var idx = 0;
      function paint() {
        img.src = urls[idx];
        dots.textContent = (idx + 1) + " / " + urls.length;
      }
      card.querySelector(".prev").onclick = function() {
        idx = (idx - 1 + urls.length) % urls.length;
        paint();
      };
      card.querySelector(".next").onclick = function() {
        idx = (idx + 1) % urls.length;
        paint();
      };
      paint();
    }

    function render(profile, products) {
      document.getElementById("shopTitle").textContent = profile.business_name || "Shop";
      document.getElementById("shopSub").textContent =
        products.length
          ? products.length + " item(s) · photos · description · Order on WhatsApp"
          : "No products yet";

      var aboutBox = document.getElementById("aboutBox");
      if (profile.about && String(profile.about).trim()) {
        aboutBox.textContent = profile.about;
        aboutBox.classList.add("show");
      } else {
        aboutBox.textContent = "";
        aboutBox.classList.remove("show");
      }

      var grid = document.getElementById("productGrid");
      if (!products.length) {
        grid.innerHTML = '<div class="empty">This shop has no products published yet.</div>';
        return;
      }

      var shopLink = window.location.href;
      var html = "";
      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        var urls = (p.images && p.images.length) ? p.images : (p.image_url ? [p.image_url] : []);
        var cover = urls[0] || "";
        var orderUrl = whatsappOrderLink(
          profile.whatsapp,
          p.name,
          money(p.price),
          profile.business_name,
          shopLink
        );

        html += '<div class="card" data-i="' + i + '">';
        html += '<div class="gallery">';
        if (cover) {
          html += '<img class="g-img" src="' + esc(cover) + '" alt="' + esc(p.name) + '" />';
        } else {
          html += '<div style="height:220px;background:#0a1018"></div>';
        }
        if (urls.length > 1) {
          html += '<button class="nav prev" type="button">‹</button>';
          html += '<button class="nav next" type="button">›</button>';
          html += '<div class="dots">1 / ' + urls.length + "</div>";
        }
        html += "</div>";
        html += '<div class="body">';
        html += '<div class="name">' + esc(p.name) + "</div>";
        html += '<div class="price">₦' + money(p.price) + "</div>";
        if (p.description) {
          html += '<div class="desc">' + esc(p.description) + "</div>";
        }
        html += '<a class="order" href="' + esc(orderUrl) + '" target="_blank" rel="noopener">Order on WhatsApp</a>';
        html += "</div></div>";
      }
      grid.innerHTML = html;

      var cards = grid.querySelectorAll(".card");
      for (var c = 0; c < cards.length; c++) {
        var pi = Number(cards[c].getAttribute("data-i"));
        var imgs = products[pi].images && products[pi].images.length
          ? products[pi].images
          : (products[pi].image_url ? [products[pi].image_url] : []);
        bindGallery(cards[c], imgs);
      }
    }

    var slug = getSlug();
    if (!slug) {
      show(msgError, "No shop selected. Open a shop link like shop.html?s=mama-ada");
      document.getElementById("shopSub").textContent = "Missing shop link";
    } else {
      sb.from("seller_profiles").select("*").eq("shop_slug", slug).maybeSingle()
        .then(function(res) {
          if (res.error) throw res.error;
          if (!res.data) throw new Error("Shop not found. Check the link.");
          var profile = res.data;
          return sb.from("products")
            .select("*")
            .eq("seller_id", profile.id)
            .eq("is_published", true)
            .order("created_at", { ascending: false })
            .then(function(pRes) {
              if (pRes.error) throw pRes.error;
              var products = pRes.data || [];
              if (!products.length) {
                render(profile, []);
                return;
              }
              var ids = products.map(function(p) { return p.id; });
              return sb.from("product_images").select("*").in("product_id", ids).order("sort_order")
                .then(function(imgRes) {
                  if (imgRes.error) throw imgRes.error;
                  var by = {};
                  var rows = imgRes.data || [];
                  for (var i = 0; i < rows.length; i++) {
                    var r = rows[i];
                    if (!by[r.product_id]) by[r.product_id] = [];
                    by[r.product_id].push(r.image_url);
                  }
                  for (var j = 0; j < products.length; j++) {
                    products[j].images = by[products[j].id] || [];
                  }
                  render(profile, products);
                });
            });
        })
        .catch(function(err) {
          show(msgError, err.message || String(err));
          document.getElementById("shopSub").textContent = "Could not load shop";
        });
    }
  </script>
</body>
</html>
